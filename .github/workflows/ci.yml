name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  audit-examples:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Clean fixtures exit 0
        run: k8s-topology-spread-audit --manifests tests/fixtures/clean

      - name: Example manifests exit 1 with findings
        run: |
          set +e
          k8s-topology-spread-audit --manifests examples/k8s
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }

      - name: JSON output is valid
        run: |
          k8s-topology-spread-audit --manifests examples/k8s --json --no-fail \
            | python -c "import json,sys; d=json.load(sys.stdin); print(d['summary'])"

      - name: Markdown summary
        run: |
          k8s-topology-spread-audit --manifests examples/k8s --markdown --no-fail \
            >> "$GITHUB_STEP_SUMMARY"
