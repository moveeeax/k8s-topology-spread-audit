[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-topology-spread-audit"
version = "0.2.0"
description = "Audit Kubernetes workloads for missing or ineffective topology spread rules"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["kubernetes", "topology-spread", "high-availability", "sre", "audit", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
live = ["kubernetes>=28.1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/moveeeax/k8s-topology-spread-audit"
Issues = "https://github.com/moveeeax/k8s-topology-spread-audit/issues"

[project.scripts]
k8s-topology-spread-audit = "k8s_topology_spread_audit.cli:main"

[tool.setuptools]
packages = ["k8s_topology_spread_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
