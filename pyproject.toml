[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-topology-spread-audit"
version = "0.1.0"
description = "Audit Kubernetes workloads for missing or ineffective topology spread rules"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["kubernetes", "topology-spread", "high-availability", "sre", "audit", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=5.4"]

[project.optional-dependencies]
live = ["kubernetes>=24.2.0"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/moveeeax/k8s-topology-spread-audit"
Issues = "https://github.com/moveeeax/k8s-topology-spread-audit/issues"

[project.scripts]
k8s-topology-spread-audit = "k8s_topology_spread_audit.cli:main"

[tool.setuptools]
packages = ["k8s_topology_spread_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
